services:
  - type: web
    name: busca-precos
    runtime: node
    plan: free
    buildCommand: npm install --omit=optional
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SERPAPI_KEY
        sync: false
      - key: LITEAPI_KEY
        sync: false
